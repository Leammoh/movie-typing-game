<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Movie Typing — V3 Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>🎬 MOVIE TYPING</h1>
      <p>V3 — la scène avance avec ta frappe</p>
    </header>

    <section id="home" class="panel">
      <button id="startBtn" class="primary">▶ Lancer le test</button>
      <p class="hint">
        Tape les phrases affichées. Chaque caractère correct fait progresser la vidéo.
      </p>
    </section>

    <section id="game" class="panel hidden">
      <div class="hud">
        <span>Score <b id="score">0</b></span>
        <span>Combo <b id="combo">0</b></span>
        <span>Précision <b id="accuracy">100%</b></span>
      </div>

      <video id="video" controls playsinline preload="metadata">
        <source src="movies/test/scene01.mp4" type="video/mp4">
      </video>

      <div class="phrase" id="phrase">Préparation…</div>

      <input
        id="typing"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Commence à taper ici…"
      >

      <div class="progress">
        <div id="bar"></div>
      </div>

      <p id="status">
        Tape la phrase pour faire avancer la scène.
      </p>
    </section>

    <section id="end" class="panel hidden">
      <h2>🎬 Fin du test</h2>
      <p>Score : <b id="finalScore">0</b></p>
      <button id="againBtn" class="primary">↻ Recommencer</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
